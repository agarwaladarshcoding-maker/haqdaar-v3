# haqdaar/audio/lines.yaml
#
# Step 1.13 (plan 1.11) — the fixed lines a call can speak.
#
# Every id in haqdaar.contracts.types.FIXED_LINE_IDS appears here exactly once, in the same
# order. English is written here by hand. Hindi and Marathi are NOT written here: they come
# from p4 (Sarvam) and are checked by p5, the same path the scheme cards take. A line an owner
# has corrected is pinned with `pinned: true` and p4 leaves it alone.
#
# House style, because these are read aloud down a phone to people with little schooling:
#   - short words, short sentences, one idea per sentence;
#   - say the key press as a number the caller can act on ("Press 1");
#   - never claim the caller is eligible, will get, or will receive anything. The call reads
#     out what a scheme says; it does not decide anyone's case. vocab.FORBIDDEN enforces this
#     and p5's G2 checks the translations for the same thing;
#   - no web addresses and no English abbreviations that cannot be spoken in Hindi or Marathi.
#
# `{...}` is a slot the engine fills at play time (a scheme name, a box label, a band). Slots
# are never translated as words; they are replaced with already-translated text.

lines:

  # --- opening -----------------------------------------------------------
  # The one line rendered as a single file in all three languages, played hi -> mr -> en
  # (p6_snapshot.py builds it with the "all" render key). It must name the languages in the
  # language the caller is being offered, so English alone cannot carry it. The English below
  # is what the English third of the file says. The hi and mr parts each offer only their own
  # language, in that language; the render (Phase 2) plays hi -> mr -> en as one file.
  greeting_trilingual:
    pinned: true
    hi: "नमस्ते। यह हकदार है। हिंदी के लिए 1 दबाएँ।"
    mr: "नमस्कार. हे हकदार आहे. मराठीसाठी 2 दाबा."
    en: "For English, press 2."

  consent_notice:
    en: "This call is recorded. We keep it to make this service better. Stay on the line to go ahead."
    hi: "यह कॉल रिकॉर्ड की जा रही है। हम इसे इस सेवा को बेहतर बनाने के लिए रख रहे हैं। आगे बढ़ने के लिए लाइन पर बने रहें।"
    mr: "हा कॉल रेकॉर्ड केला जात आहे. ही सेवा अधिक चांगली करण्यासाठी आम्ही तो जपून ठेवतो. पुढे जाण्यासाठी लाईनवर रहा."

  opener_prompt:
    pinned: true
    en: "Tell me what you need help with. You can also say the name of a scheme."
    hi: "बताइए, आपको किस बात में मदद चाहिए। आप किसी योजना का नाम भी बता सकते हैं।"
    mr: "तुम्हाला कशात मदत हवी आहे ते सांगा. तुम्ही योजनेचे नाव देखील सांगू शकता."

  unclear_prompt:
    en: "Sorry, I did not catch that. Please say it again."
    hi: "माफ़ कीजिए, मैं समझ नहीं पाई। कृपया इसे फिर से कहें।"
    mr: "माफ करा, मला ते समजले नाही. कृपया ते पुन्हा सांगा."

  anything_else:
    pinned: true
    en: "Do you want to hear anything else? Press 1 for yes. Press 2 for no."
    hi: "क्या आप कुछ और सुनना चाहते हैं? हाँ के लिए 1 दबाएँ। नहीं के लिए 2 दबाएँ।"
    mr: "तुम्हाला आणखी काही ऐकायचे आहे का? हो साठी 1 दाबा. नाही साठी 2 दाबा."

  # --- door A · the caller named a scheme --------------------------------
  # One candidate is simply read out. Two get one keypad turn naming both. Three or more fall
  # through to the questions (door B), which is a downgrade, not an error.
  # No {slots}: clips are pre-rendered, so the scheme name follows as its own
  # chunk ("scheme:<slug>:name") in the say() sequence. Sequence: option_1,
  # name 1, option_2, name 2, option_none.
  door_a_option_1:
    en: "Press 1 for:"
    hi: "1 दबाएँ:"
    mr: "1 दाबा:"

  door_a_option_2:
    en: "Press 2 for:"
    hi: "2 दबाएँ:"
    mr: "2 दाबा:"

  door_a_option_none:
    en: "Press 3 if you want neither of these."
    hi: "यदि आप इनमें से कुछ भी नहीं चाहते हैं तो 3 दबाएँ।"
    mr: "तुम्हाला यापैकी काहीही नको असल्यास 3 दाबा."

  door_a_downgrade_to_b:
    pinned: true
    en: "I will ask you a few short questions instead."
    hi: "इसके बजाय, मैं आपसे कुछ छोटे सवाल पूछूंगी।"
    mr: "त्याऐवजी, मी तुम्हाला काही छोटे प्रश्न विचारेन."

  # --- the questions -----------------------------------------------------
  q_state:
    pinned: true
    en: "Which state do you live in?"
    hi: "आप किस राज्य में रहते हैं?"
    mr: "तुम्ही कोणत्या राज्यात राहता?"

  # Asked in place of q_state where only Maharashtra schemes are loaded, so the caller is not
  # asked an open question the corpus cannot answer.
  state_q_maharashtra:
    pinned: true
    en: "Do you live in Maharashtra? Press 1 for yes. Press 2 for no."
    hi: "क्या आप महाराष्ट्र में रहते हैं? हाँ के लिए 1 दबाएँ। नहीं के लिए 2 दबाएँ।"
    mr: "तुम्ही महाराष्ट्रात राहता का? होय म्हणण्यासाठी 1 दाबा. नाही म्हणण्यासाठी 2 दाबा."

  q_gender:
    en: "Are you a woman or a man?"
    hi: "क्या आप महिला हैं या पुरुष?"
    mr: "तुम्ही स्त्री आहात की पुरुष?"

  q_social_category:
    en: "Which category do you belong to? General, O B C, S C, or S T."
    hi: "आप किस श्रेणी से संबंधित हैं? सामान्य, ओबीसी, एससी, या एसटी?"
    mr: "तुम्ही कोणत्या वर्गात मोडता? सामान्य, ओबीसी, एससी, की एसटी?"

  q_age:
    pinned: true
    en: "How old are you?"
    hi: "आपकी उम्र क्या है?"
    mr: "तुमचे वय किती आहे?"

  q_income_band:
    en: "About how much does your family earn in a year?"
    hi: "आपका परिवार एक साल में लगभग कितना कमाता है?"
    mr: "तुमचे कुटुंब वर्षाला किती कमावते?"

  q_occupation:
    pinned: true
    en: "What work do you do?"
    hi: "आप क्या काम करते हैं?"
    mr: "तुम्ही काय काम करता?"

  # --- asked a second time, in other words -------------------------------
  rephrase_state:
    pinned: true
    en: "Which state is your home in?"
    hi: "आपका घर किस राज्य में है?"
    mr: "तुम्ही कोणत्या राज्यात राहता?"

  rephrase_gender:
    en: "Please say woman, man, or other."
    hi: "कृपया महिला, पुरुष या अन्य कहें।"
    mr: "कृपया स्त्री, पुरुष किंवा इतर असे म्हणा."

  rephrase_social_category:
    pinned: true
    en: "Please say your category. General, O B C, S C, or S T. You can also say you do not want to tell."
    hi: "कृपया अपनी श्रेणी बताइए। सामान्य, ओबीसी, एससी, या एसटी। अगर आप नहीं बताना चाहते, तो यह भी कह सकते हैं।"
    mr: "कृपया तुमची श्रेणी सांगा. सामान्य, ओबीसी, एससी, किंवा एसटी. तुम्ही सांगू इच्छित नाही असेही तुम्ही म्हणू शकता."

  rephrase_age:
    en: "Please say your age in years, like thirty five."
    hi: "कृपया अपनी उम्र वर्षों में बताएं, जैसे पैंतीस।"
    mr: "कृपया तुमचे वय वर्षांमध्ये सांगा, जसे की पस्तीस."

  rephrase_income_band:
    en: "Please say how much the whole family earns in one year."
    hi: "कृपया बताएं कि पूरा परिवार एक साल में कितना कमाता है।"
    mr: "संपूर्ण कुटुंबाची एका वर्षातील कमाई किती आहे ते कृपया सांगा."

  rephrase_occupation:
    pinned: true
    en: "Please say the work you do, like farming or a shop."
    hi: "कृपया अपना काम बताइए, जैसे खेती या दुकान।"
    mr: "तुम्ही जे काम करता ते सांगा, जसे शेती किंवा दुकान."

  # --- dropped to the keypad ---------------------------------------------
  # Each of these is followed by the box's chips, one per key, from vocab.LABELS.
  keypad_gender:
    en: "Let us use the keypad."
    hi: "आइए कीपैड का उपयोग करें।"
    mr: "चला कीपॅड वापरूया."

  keypad_social_category:
    en: "Let us use the keypad."
    hi: "आइए कीपैड का उपयोग करें।"
    mr: "चला कीपॅड वापरूया."

  keypad_age:
    pinned: true
    en: "Let us use the keypad. Press the key for your age group."
    hi: "चलिए कीपैड का उपयोग करते हैं। अपनी उम्र के लिए बटन दबाएँ।"
    mr: "चला कीपॅड वापरूया. तुमच्या वयासाठी बटण दाबा."

  keypad_income_band:
    pinned: true
    en: "Let us use the keypad. Press the key for your yearly family earning."
    hi: "चलिए कीपैड का उपयोग करते हैं। परिवार की साल भर की कमाई के लिए बटन दबाएँ।"
    mr: "चला कीपॅड वापरूया. कुटुंबाच्या वर्षाच्या कमाईसाठी बटण दाबा."

  keypad_occupation:
    pinned: true
    en: "Let us use the keypad. Press the key for your work."
    hi: "चलिए कीपैड का उपयोग करते हैं। अपने काम के लिए बटन दबाएँ।"
    mr: "चला कीपॅड वापरूया. तुमच्या कामासाठी बटण दाबा."

  # Appended after the last chip, so a caller who does not fit any of them has a way out.
  # 0 is "don't know" on every box (D13); 9 would clash with the ninth chip.
  keypad_unknown_suffix:
    pinned: true
    en: "If you do not know, or do not want to say, press 0."
    hi: "अगर आप नहीं जानते, या नहीं बताना चाहते, तो 0 दबाएँ।"
    mr: "तुम्हाला माहीत नसेल, किंवा सांगायचे नसेल, तर 0 दाबा."

  # --- confirming what was heard -----------------------------------------
  bundle_confirm_intro:
    pinned: true
    en: "Let me say back what I heard."
    hi: "मैंने जो सुना, वह दोहराती हूँ।"
    mr: "मी जे ऐकले ते परत सांगते."

  confirm_bundle_opener:
    en: "You said {bundle}."
    hi: "आपने {bundle} कहा।"
    mr: "तुम्ही {bundle} म्हणालात."

  confirm_yn_suffix:
    en: "Press 1 if this is right. Press 2 to fix it."
    hi: "अगर यह सही है तो 1 दबाएँ। इसे ठीक करने के लिए 2 दबाएँ।"
    mr: "हे बरोबर असल्यास 1 दाबा. ते दुरुस्त करण्यासाठी 2 दाबा."

  # Played when the caller has gone quiet, to show the line is still open.
  silence_presence:
    en: "I am still here."
    hi: "मैं अभी भी यहीं हूँ।"
    mr: "मी अजूनही इथेच आहे."

  # --- reading a scheme out ----------------------------------------------
  section_menu:
    pinned: true
    en: "Press 1 for what you get. Press 2 for how to apply. Press 3 for the papers needed. Press 4 for who can apply. Press 9 for the next scheme."
    hi: "योजना में क्या मिलता है, इसके लिए 1 दबाएँ। आवेदन कैसे करें, इसके लिए 2 दबाएँ। कौन से कागज़ चाहिए, इसके लिए 3 दबाएँ। कौन आवेदन कर सकता है, इसके लिए 4 दबाएँ। अगली योजना के लिए 9 दबाएँ।"
    mr: "योजनेत काय मिळते यासाठी 1 दाबा. अर्ज कसा करायचा यासाठी 2 दाबा. कोणती कागदपत्रे लागतात यासाठी 3 दाबा. कोण अर्ज करू शकते यासाठी 4 दाबा. पुढील योजनेसाठी 9 दाबा."

  # Said before a section so the caller knows whose words these are: the government's, not ours.
  section_source_frame:
    en: "This is what the government page says."
    hi: "सरकारी पेज पर यही लिखा है।"
    mr: "सरकारी पानावर हेच लिहिले आहे."

  next_scheme_intro:
    en: "Now the next scheme."
    hi: "अब अगली योजना।"
    mr: "आता पुढची योजना."

  no_more_schemes:
    en: "That was the last scheme."
    hi: "वह आखिरी योजना थी।"
    mr: "ती शेवटची योजना होती."

  results_more_prompt:
    en: "Press 9 to hear more schemes."
    hi: "अधिक योजनाओं के बारे में सुनने के लिए 9 दबाएँ।"
    mr: "अधिक योजना ऐकण्यासाठी 9 दाबा."

  # --- things the caller must be told plainly ----------------------------
  keypad_only_mode:
    pinned: true
    en: "I am having trouble hearing you. We will use the keypad from now on."
    hi: "मुझे आपको सुनने में परेशानी हो रही है। अब से हम कीपैड का उपयोग करेंगे।"
    mr: "मला तुमचे बोलणे नीट ऐकू येत नाही. आतापासून आपण कीपॅड वापरू."

  state_unknown_disclaimer:
    pinned: true
    en: "I do not know your state, so some of these may not run where you live."
    hi: "मुझे आपके राज्य के बारे में नहीं पता, इसलिए इनमें से कुछ आपके क्षेत्र में नहीं चल सकते हैं।"
    mr: "मला तुमचे राज्य माहीत नाही, त्यामुळे यातील काही योजना तुमच्या राज्यात लागू नसतील."

  # --- the five endings --------------------------------------------------
  results_exact_preamble:
    pinned: true
    en: "Here is what matches what you told me."
    hi: "आपने जो बताया, उससे ये योजनाएँ मेल खाती हैं।"
    mr: "तुम्ही जे सांगितले, त्याच्याशी या योजना जुळतात."

  results_overflow:
    en: "Many schemes match. Here are the closest ones first."
    hi: "कई योजनाएँ मेल खाती हैं। यहाँ सबसे करीबी योजनाएँ पहले दी गई हैं।"
    mr: "अनेक योजना जुळतात. येथे सर्वात जवळच्या योजना प्रथम आहेत."

  # Bad news first: the caller is told nothing matched before any name is read.
  terminal_widened_preamble:
    pinned: true
    en: "Nothing matched everything you told me."
    hi: "आपने जो कुछ बताया, उस सब से कोई योजना मेल नहीं खाती।"
    mr: "तुम्ही सांगितलेल्या सगळ्या गोष्टींशी कोणतीही योजना जुळली नाही."

  drop_income_band:
    pinned: true
    en: "I have set aside what your family earns."
    hi: "मैंने आपके परिवार की कमाई वाली बात अलग रख दी है।"
    mr: "मी तुमच्या कुटुंबाच्या कमाईची गोष्ट बाजूला ठेवली आहे."

  drop_age:
    pinned: true
    en: "I have set aside your age."
    hi: "मैंने आपकी उम्र वाली बात अलग रख दी है।"
    mr: "मी तुमच्या वयाची गोष्ट बाजूला ठेवली आहे."

  drop_occupation:
    pinned: true
    en: "I have set aside your work."
    hi: "मैंने आपके काम वाली बात अलग रख दी है।"
    mr: "मी तुमच्या कामाची गोष्ट बाजूला ठेवली आहे."

  results_widened_lead:
    pinned: true
    en: "With that set aside, these schemes match."
    hi: "उसे अलग रखकर, ये योजनाएँ मेल खाती हैं।"
    mr: "ते बाजूला ठेवल्यावर, या योजना जुळतात."

  terminal_nearest_preamble:
    pinned: true
    en: "Nothing matched. These are the nearest ones. Check the rules before you apply."
    hi: "कोई योजना पूरी तरह मेल नहीं खाई। ये सबसे नज़दीकी हैं। आवेदन करने से पहले नियम जाँच लें।"
    mr: "काहीही जुळले नाही. ह्या सर्वात जवळच्या आहेत. अर्ज करण्यापूर्वी नियम तपासा."

  terminal_empty:
    pinned: true
    en: "I could not find a scheme for you today. Your nearest C S C centre can help you look."
    hi: "आज मुझे आपके लिए कोई योजना नहीं मिली। आपके पास का सीएससी केंद्र खोजने में मदद कर सकता है।"
    mr: "आज मला तुमच्यासाठी कोणतीही योजना सापडली नाही. तुमच्या जवळचे सीएससी केंद्र शोधायला मदत करू शकते."

  closing_farewell:
    en: "Thank you for calling Haqdaar. Goodbye."
    hi: "हकदार को कॉल करने के लिए धन्यवाद। अलविदा।"
    mr: "हकदारला कॉल केल्याबद्दल धन्यवाद. नमस्कार."
