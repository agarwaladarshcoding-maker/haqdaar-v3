[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haqdaar"
version = "0.1.0"
description = "Haqdaar - voice agent for scheme discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "httpx",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "playwright",
    "pytest",
    "pytest-asyncio",
    "numpy",
    "fastembed",
    "rapidfuzz",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["haqdaar*"]
